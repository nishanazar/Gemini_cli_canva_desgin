<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canva Hero Section</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav aria-label="Main navigation">
            <div class="nav-left">
                <a href="#" class="logo" aria-label="Canva Home">Canva</a>
            </div>
            <div class="nav-center">
                <ul>
                    <li><a href="#">Design</a></li>
                    <li><a href="#">Product</a></li>
                    <li><a href="#">Plans</a></li>
                    <li><a href="#">Business</a></li>
                    <li><a href="#">Education</a></li>
                    <li><a href="#">Help</a></li>
                </ul>
            </div>
            <div class="nav-right">
                <button class="btn btn-primary" aria-label="Sign up">Sign up</button>
                <button class="btn btn-secondary" aria-label="Log in">Log in</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-headline">
            <h1 id="hero-headline">A new era<br>of imagination</h1>
            <p class="subheading">Discover a whole new world of skills and tools designed to put your imagination to work.</p>
            <div class="cta-buttons">
                <button class="btn btn-cta-light" aria-label="Start designing for free">Start designing for free</button>
                <button class="btn btn-cta-dark" aria-label="Explore our launches">Explore our launches</button>
            </div>
        </section>
    </main>
</body>
</html>
